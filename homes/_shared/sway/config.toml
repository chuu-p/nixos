[theme]
theme = "solarized-dark"

[icons]
icons = "awesome4"

[[block]]
block = "sound"

[[block]]
block = "network"
primary_only = true
active_bg = "#76c7c0"
active_fg = "#002b36"
inactive_bg = "#586e75"
inactive_fg = "#002b36"
good_bg = "#859900"
good_fg = "#002b36"
warning_bg = "#b58900"
warning_fg = "#002b36"
critical_bg = "#dc322f"
critical_fg = "#002b36"
format = "{alias} up {speed_down} down {speed_up}"
format_down = "{alias} down"

[[block]]
block = "battery"
format = "{percentage}% {time}"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
warning = 20.0
alert = 10.0
alert_unit = "GB"
interval = 5

[[block]]
block = "load"
format = "{1m}"

[[block]]
block = "memory"
format = "{mem_used_percents}%"

[[block]]
block = "time"
interval = 5
format = "%Y-%m-%d %H:%M:%S"
timezone = "local"
